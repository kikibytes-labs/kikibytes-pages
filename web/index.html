<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- REQUIRED: fixes infinite loading on Cloudflare -->
    <base href="/" />

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KikiBytes Labs — Innovative Indie Games & Apps</title>
    <meta name="description" content="KikiBytes Labs is a small indie development studio crafting playful, thoughtfully engineered games and apps.">

    <!-- Open Graph -->
    <meta property="og:title" content="KikiBytes Labs">
    <meta property="og:description" content="Innovative & fun indie games and apps.">
    <meta property="og:type" content="website">

    <!-- Brand color -->
    <meta name="theme-color" content="#FF8A00">

    <!-- Loading indicator shown before Flutter boots -->
    <style>
      body {
        margin: 0;
        background: #F7F8FA;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
      }
      #loading {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        font-family: sans-serif;
        color: #6b7280;
        font-size: 14px;
      }
      .spinner {
        width: 36px;
        height: 36px;
        border: 3px solid #e5e7eb;
        border-top-color: #FF8A00;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      flt-glass-pane {
        background: transparent !important;
      }
    </style>

    <!-- REQUIRED for Flutter Web -->
    <script src="flutter_bootstrap.js" async></script>
  </head>

  <body>
    <div id="loading">
      <div class="spinner"></div>
      <span>Loading KikiBytes Labs…</span>
    </div>

    <script>
      window.addEventListener('flutter-first-frame', function () {
        const el = document.getElementById('loading');
        if (el) el.remove();
      });
    </script>
  </body>
</html>
