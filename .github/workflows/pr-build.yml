name: PR Build

concurrency:
  group: refs-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  pr-build:
    name: Build Flutter Web on PR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter 3.13.0 (deterministic)
        run: |
          set -eux
          FLUTTER_VERSION=3.41.2-stable
          ARCHIVE=flutter_linux_${FLUTTER_VERSION}.tar.xz
          curl -sSLO https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/${ARCHIVE}
          mkdir -p "$RUNNER_TEMP"
          tar -xf ${ARCHIVE} -C "$RUNNER_TEMP"
          echo "FLUTTER_ROOT=$RUNNER_TEMP/flutter" >> $GITHUB_ENV
          echo "$RUNNER_TEMP/flutter/bin" >> $GITHUB_PATH
          echo "PATH=$RUNNER_TEMP/flutter/bin:$PATH" >> $GITHUB_ENV

      - name: Show Flutter version
        run: flutter --version

      - name: Check Flutter health
        run: |
          flutter doctor -v
          flutter analyze

      - name: Cache Pub
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}

      - name: Install dependencies
        run: flutter pub get

      - name: Build web (release)
        run: flutter build web --release
