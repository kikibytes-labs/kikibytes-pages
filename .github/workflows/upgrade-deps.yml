name: Upgrade Dependencies

concurrency:
  group: refs-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 3 * * 0' # weekly on Sunday at 03:00 UTC

permissions:
  contents: write
  pull-requests: write

jobs:
  upgrade:
    name: Upgrade Flutter dependencies and create PR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter 3.13.0 (deterministic)
        run: |
          set -eux
          FLUTTER_VERSION=3.13.0-stable
          ARCHIVE=flutter_linux_${FLUTTER_VERSION}.tar.xz
          curl -sSLO https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/${ARCHIVE}
          mkdir -p "$RUNNER_TEMP"
          tar -xf ${ARCHIVE} -C "$RUNNER_TEMP"
          echo "FLUTTER_ROOT=$RUNNER_TEMP/flutter" >> $GITHUB_ENV
          echo "$RUNNER_TEMP/flutter/bin" >> $GITHUB_PATH
          echo "PATH=$RUNNER_TEMP/flutter/bin:$PATH" >> $GITHUB_ENV

      - name: Show Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Upgrade dependencies (major versions)
        run: flutter pub upgrade --major-versions

      - name: Check Flutter health
        run: |
          flutter doctor -v
          flutter analyze

      - name: Create Pull Request with updated lockfile
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(deps): upgrade dependencies"
          branch: "upgrade/deps-${{ github.run_id }}"
          title: "chore: upgrade dependencies"
          body: |
            This PR contains dependency upgrades performed automatically by CI.
            Please review and run tests before merging.
          labels: automated, dependencies
