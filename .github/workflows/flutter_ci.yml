name: Flutter CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Use an explicit SDK version instead of the channel name to avoid
          # the action failing to resolve the channel in some environments.
          # Update this value if you want a newer Flutter SDK in CI.
          flutter-version: '3.10.6'

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: |
          if flutter test --help >/dev/null 2>&1; then
            flutter test || true
          fi

      - name: Build web (release)
        run: flutter build web --release
