name: Build and Deploy to Cloudflare Pages

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build web
        run: flutter build web --release

      - name: Deploy to Cloudflare Pages (Wrangler)
        run: npx wrangler pages deploy build/web --project-name=kikibytes-pages
        env:
          CLOUDFLARE_API_TOKEN: foOwdWGWDIJtcI1MM3VUppvL9XxWguLFtwpaGElY
